[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pretrade"
version = "1.6.0"
description = "Pre-trade options strategy workstation — pricing, Greeks, multi-leg analysis, live data, and risk before you trade"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "MrKhan025" },
]
keywords = [
    "options",
    "black-scholes",
    "greeks",
    "streamlit",
    "quant",
    "derivatives",
    "implied-volatility",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "streamlit>=1.36.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pandas>=2.1.0",
    "plotly>=5.22.0",
    "kaleido>=0.2.1",
    "yfinance>=0.2.40",
    "reportlab>=4.0.0",
    "streamlit-autorefresh>=1.0.1",
    "websocket-client>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]
data = [
    "yfinance>=0.2.40",
]

[project.urls]
Homepage = "https://github.com/MrKhan025/PreTrade"
Repository = "https://github.com/MrKhan025/PreTrade"
Issues = "https://github.com/MrKhan025/PreTrade/issues"

[project.scripts]
pretrade = "app:main"

[tool.setuptools]
py-modules = ["black_scholes", "charts", "binomial", "monte_carlo", "risk", "market_data", "pdf_export", "streaming", "config"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 110
target-version = "py310"
