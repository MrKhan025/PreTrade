name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

env:
  FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY || 'dbg5c3hr01qidncm8hpgdbg5c3hr01qidncm8hq0' }}

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository (Node 24)
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }} (Node 24)
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Normalize repository structure if legacy files exist
        run: |
          [ -f "Black Scholes.py" ] && [ ! -f "black_scholes.py" ] && cp "Black Scholes.py" "black_scholes.py" || true
          [ -f "Charts.py" ] && [ ! -f "charts.py" ] && cp "Charts.py" "charts.py" || true
          [ -f "Requirements.txt" ] && [ ! -f "requirements.txt" ] && cp "Requirements.txt" "requirements.txt" || true
          mkdir -p tests
          [ -f "Test Black Scholes.py" ] && [ ! -f "tests/test_black_scholes.py" ] && cp "Test Black Scholes.py" "tests/test_black_scholes.py" || true
          [ -f "test_black_scholes.py" ] && [ ! -f "tests/test_black_scholes.py" ] && cp "test_black_scholes.py" "tests/test_black_scholes.py" || true
          [ -f "test_advanced.py" ] && [ ! -f "tests/test_advanced.py" ] && cp "test_advanced.py" "tests/test_advanced.py" || true
          [ -f "test_market_pdf.py" ] && [ ! -f "tests/test_market_pdf.py" ] && cp "test_market_pdf.py" "tests/test_market_pdf.py" || true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Run unit tests via pytest
        run: pytest tests -v

      - name: Run unit tests via unittest discovery
        run: python -m unittest discover -s tests -v
